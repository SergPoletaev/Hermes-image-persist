name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline verification suite
        run: python selfcheck.py
      - name: Installer refuses without Hermes
        run: |
          if python install.py --home /tmp/nope-home --root /tmp/nope-root 2>/dev/null; then
            echo "ERROR: installer should have refused (exit 0) but did not"
            exit 1
          fi
