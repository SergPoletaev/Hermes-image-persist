name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selfcheck:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline verification suite
        run: python selfcheck.py
      - name: Installer preview refuses cleanly without Hermes
        shell: bash
        run: |
          set -e
          python install.py --home "$RUNNER_TEMP/nope-home" --root "$RUNNER_TEMP/nope-root" && exit 1 || code=$?
          # expected: exit code 1 with a clear message
          test "${code:-0}" = "1"
